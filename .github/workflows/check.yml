name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - run: node install.mjs --dry-run --no-claude-code --no-desktop
        continue-on-error: true # en CI no hay Photoshop instalado
